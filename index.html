
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ระบบพิมพ์ใบปะหน้า A4 - 4 รูปต่อหน้า</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        /* ========================================
           A4 แนวตั้ง
        ======================================== */

        @page {
            size: A4 portrait;
            margin: 0;
        }


        /* ========================================
           หน้ากระดาษ
           210 x 297 mm
           4 รูป = 2 x 2
        ======================================== */

        .page-container {
            width: 210mm;
            height: 297mm;

            margin: 0 auto 20mm auto;
            padding: 0;

            background: white;

            display: grid;

            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;

            gap: 0;

            overflow: hidden;

            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
        }


        /* ========================================
           กล่องรูป
        ======================================== */

        .image-box {
            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            border: none;
            border-radius: 0;

            background: white;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            position: relative;
        }


        /* ========================================
           รูปภาพ
        ======================================== */

        .image-box img {
            display: block;

            max-width: 100%;
            max-height: 100%;

            width: auto;
            height: auto;

            object-fit: contain;
        }


        /* ========================================
           ปุ่มลบ
        ======================================== */

        .delete-btn {
            position: absolute;

            top: 10px;
            right: 10px;

            width: 36px;
            height: 36px;

            border-radius: 50%;

            border: none;

            background: #dc2626;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 10;

            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);

            transition: 0.2s;
        }

        .delete-btn:hover {
            background: #b91c1c;

            transform: scale(1.05);
        }


        /* ========================================
           ช่องว่างกรณีหน้าสุดท้ายมีรูปไม่ครบ 4
        ======================================== */

        .empty-box {
            visibility: hidden;
        }


        /* ========================================
           PRINT
        ======================================== */

        @media print {

            html,
            body {
                width: 210mm;
                margin: 0 !important;
                padding: 0 !important;

                background: white !important;
            }


            /* ซ่อนส่วนควบคุม */

            .no-print {
                display: none !important;
            }


            /* ซ่อนปุ่มลบ */

            .delete-btn {
                display: none !important;
            }


            /* พื้นที่พิมพ์ */

            #printArea {
                margin: 0 !important;
                padding: 0 !important;

                width: 210mm !important;
            }


            /* A4 */

            .page-container {

                width: 210mm !important;
                height: 297mm !important;

                margin: 0 !important;
                padding: 0 !important;

                display: grid !important;

                grid-template-columns: 1fr 1fr !important;
                grid-template-rows: 1fr 1fr !important;

                gap: 0 !important;

                box-shadow: none !important;

                overflow: hidden !important;

                page-break-after: always !important;
                break-after: page !important;

                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }


            .page-container:last-child {
                page-break-after: avoid !important;
                break-after: avoid !important;
            }


            /* กล่องรูป */

            .image-box {

                width: 100% !important;
                height: 100% !important;

                margin: 0 !important;
                padding: 0 !important;

                border: none !important;
                border-radius: 0 !important;

                overflow: hidden !important;

                display: flex !important;

                align-items: center !important;
                justify-content: center !important;

                background: white !important;
            }


            /* รูป */

            .image-box img {

                display: block !important;

                max-width: 100% !important;
                max-height: 100% !important;

                width: auto !important;
                height: auto !important;

                object-fit: contain !important;
            }
        }
    </style>
</head>


<body class="bg-gray-100 py-8">


    <!-- ==========================================
         ส่วนควบคุม
    =========================================== -->

    <div class="max-w-xl mx-auto mb-8 bg-white p-6 rounded-lg shadow-md no-print">

        <h2 class="text-xl font-bold mb-2 text-gray-800">
            ระบบพิมพ์ใบปะหน้า
        </h2>

        <p class="text-sm text-gray-500 mb-5">
            A4 แนวตั้ง • 4 รูปต่อหน้า • 2 × 2 • ชิดขอบกระดาษ
        </p>


        <!-- เลือกรูป -->

        <div class="mb-4">

            <label class="block text-sm font-medium text-gray-700 mb-2">
                เลือกรูปใบปะหน้า
            </label>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                multiple
                class="w-full text-sm text-gray-500
                file:mr-4
                file:py-2
                file:px-4
                file:rounded-md
                file:border-0
                file:text-sm
                file:font-semibold
                file:bg-blue-50
                file:text-blue-700
                hover:file:bg-blue-100"
            >

        </div>


        <!-- ปุ่ม -->

        <div class="flex gap-2">

            <button
                onclick="window.print()"
                class="flex-1 bg-blue-600 text-white py-2 px-4
                rounded-md font-medium
                hover:bg-blue-700 transition"
            >
                🖨️ พิมพ์ทั้งหมด
            </button>


            <button
                onclick="clearAll()"
                class="bg-red-600 text-white py-2 px-4
                rounded-md font-medium
                hover:bg-red-700 transition"
            >
                🗑️ ลบทั้งหมด
            </button>

        </div>


        <!-- จำนวนรูป -->

        <div
            id="imageCount"
            class="mt-3 text-sm text-gray-500 text-center"
        >
            รูปทั้งหมด 0 รูป
        </div>

    </div>



    <!-- ==========================================
         พื้นที่แสดง A4
    =========================================== -->

    <div id="printArea">

        <div
            id="empty-message"
            class="text-center text-gray-500 py-10 no-print"
        >

            ยังไม่ได้เลือกรูปภาพ

            <br>

            กรุณาเลือกรูปภาพด้านบน

        </div>

    </div>



    <script>

        /* ========================================
           ตัวแปร
        ======================================== */

        let allImages = [];


        const imageInput =
            document.getElementById("imageInput");


        const printArea =
            document.getElementById("printArea");


        const imageCount =
            document.getElementById("imageCount");



        /* ========================================
           เลือกรูป
        ======================================== */

        imageInput.addEventListener(
            "change",
            function (event) {

                const files =
                    event.target.files;


                if (!files || files.length === 0) {
                    return;
                }


                const readers =
                    Array.from(files).map(file => {

                        return new Promise(
                            (resolve, reject) => {

                                const reader =
                                    new FileReader();


                                reader.onload =
                                    function (e) {

                                        resolve(
                                            e.target.result
                                        );

                                    };


                                reader.onerror =
                                    function () {

                                        reject(
                                            new Error(
                                                "ไม่สามารถอ่านไฟล์ได้"
                                            )
                                        );

                                    };


                                reader.readAsDataURL(file);

                            }
                        );

                    });



                Promise.all(readers)

                    .then(images => {

                        /*
                         เพิ่มรูปใหม่
                         ต่อจากรูปเดิม
                        */

                        allImages =
                            allImages.concat(images);


                        /*
                         Reset input
                         เพื่อให้เลือกไฟล์เดิมซ้ำได้
                        */

                        imageInput.value = "";


                        /*
                         Render ใหม่
                        */

                        renderPages();

                    })

                    .catch(error => {

                        console.error(error);

                        alert(
                            "เกิดข้อผิดพลาดในการอ่านรูปภาพ"
                        );

                    });

            }
        );



        /* ========================================
           ลบรูป
        ======================================== */

        function removeImage(index) {

            allImages.splice(index, 1);

            renderPages();

        }



        /* ========================================
           ลบทั้งหมด
        ======================================== */

        function clearAll() {

            if (allImages.length === 0) {
                return;
            }


            const confirmDelete =
                confirm(
                    "ต้องการลบรูปภาพทั้งหมดหรือไม่?"
                );


            if (!confirmDelete) {
                return;
            }


            allImages = [];


            renderPages();

        }



        /* ========================================
           สร้างหน้า A4
        ======================================== */

        function renderPages() {

            /*
             เคลียร์พื้นที่เดิม
            */

            printArea.innerHTML = "";


            /*
             อัปเดตจำนวนรูป
            */

            imageCount.innerText =
                `รูปทั้งหมด ${allImages.length} รูป`;


            /*
             ถ้าไม่มีรูป
            */

            if (allImages.length === 0) {

                printArea.innerHTML = `

                    <div
                        class="text-center text-gray-500 py-10 no-print"
                    >

                        ยังไม่ได้เลือกรูปภาพ

                        <br>

                        กรุณาเลือกรูปภาพด้านบน

                    </div>

                `;

                return;
            }



            /* ====================================
               แบ่งรูปทีละ 4
            ==================================== */

            for (
                let i = 0;
                i < allImages.length;
                i += 4
            ) {


                /*
                 สร้างหน้า A4
                */

                const pageDiv =
                    document.createElement("div");


                pageDiv.className =
                    "page-container";



                /* ====================================
                   สร้างกล่องรูป
                ==================================== */

                function createBox(
                    imgSrc,
                    globalIndex
                ) {

                    const box =
                        document.createElement("div");


                    box.className =
                        "image-box";


                    /*
                     ถ้ามีรูป
                    */

                    if (imgSrc) {


                        /* รูป */

                        const img =
                            document.createElement("img");


                        img.src =
                            imgSrc;


                        img.alt =
                            `ใบปะหน้า ${globalIndex + 1}`;


                        box.appendChild(img);



                        /* ปุ่มลบ */

                        const deleteBtn =
                            document.createElement("button");


                        deleteBtn.className =
                            "delete-btn";


                        deleteBtn.innerHTML =
                            "✕";


                        deleteBtn.title =
                            "ลบรูปนี้";


                        deleteBtn.type =
                            "button";


                        deleteBtn.onclick =
                            function () {

                                removeImage(
                                    globalIndex
                                );

                            };


                        box.appendChild(
                            deleteBtn
                        );

                    }

                    else {

                        /*
                         ช่องว่าง
                         กรณีรูปไม่ครบ 4
                        */

                        box.classList.add(
                            "empty-box"
                        );

                    }


                    return box;

                }



                /* ====================================
                   เพิ่ม 4 รูป
                ==================================== */

                pageDiv.appendChild(

                    createBox(
                        allImages[i],
                        i
                    )

                );


                pageDiv.appendChild(

                    createBox(
                        allImages[i + 1],
                        i + 1
                    )

                );


                pageDiv.appendChild(

                    createBox(
                        allImages[i + 2],
                        i + 2
                    )

                );


                pageDiv.appendChild(

                    createBox(
                        allImages[i + 3],
                        i + 3
                    )

                );



                /*
                 เพิ่มหน้าเข้า printArea
                */

                printArea.appendChild(
                    pageDiv
                );

            }

        }

    </script>

</body>
</html>
