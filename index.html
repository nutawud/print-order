<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบพิมพ์ใบปะหน้าพัสดุ (A4 แนวนอน - 3 รูป พร้อมปุ่มลบ)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }
        @page {
            size: A4 landscape;
            margin: 0;
        }
        @media print {
            body {
                background-color: white !important;
                margin: 0 !important;
                padding: 0 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .no-print {
                display: none !important;
            }
            .delete-btn {
                display: none !important; /* ซ่อนปุ่มลบตอนสั่งปริ้นท์ */
            }
            .page-container {
                box-shadow: none !important;
                margin: 0 !important;
                width: 297mm !important;
                height: 210mm !important;
                max-height: 210mm !important;
                overflow: hidden !important;
                padding: 10mm !important;
                page-break-after: always;
                break-after: page;
                page-break-inside: avoid;
                break-inside: avoid;
            }
            .page-container:last-child {
                page-break-after: avoid !important;
                break-after: avoid !important;
            }
        }

        /* ล็อคขนาดพรีวิวบนหน้าจอให้เป็น A4 แนวนอนชัดเจน (กว้าง 297mm x สูง 210mm) */
        .page-container {
            width: 297mm;
            height: 210mm;
            margin: 0 auto 20mm auto;
            background: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 15mm;
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-100 py-8">

    <!-- ส่วนควบคุมสำหรับอัปโหลดและสั่งพิมพ์ -->
    <div class="max-w-xl mx-auto mb-8 bg-white p-6 rounded-lg shadow-md no-print">
        <h2 class="text-xl font-bold mb-4 text-gray-800">ระบบพิมพ์ใบปะหน้า (A4 แนวนอน - 3 รูปต่อหน้า)</h2>
        
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">เลือกรูปใบปะหน้าทั้งหมด (เลือกเพิ่มทีหลังได้)</label>
            <input type="file" id="imageInput" accept="image/*" multiple 
                class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <button onclick="window.print()" 
            class="w-full bg-blue-600 text-white py-2 px-4 rounded-md font-medium hover:bg-blue-700 transition duration-200">
            🖨️ พิมพ์ใบปะหน้าทั้งหมด (A4 แนวนอน)
        </button>
    </div>

    <!-- พื้นที่แสดงผลหน้ากระดาษ A4 แนวนอนทั้งหมด -->
    <div id="printArea">
        <div class="text-center text-gray-500 py-10 no-print" id="empty-message">
            ยังไม่ได้เลือกรูปภาพ กรุณาเลือกรูปภาพด้านบน
        </div>
    </div>

    <!-- Script จัดการรูปภาพและระบบลบรูป -->
    <script>
        let allImages = []; // เก็บรายการรูปภาพทั้งหมดในหน่วยความจำ
        const imageInput = document.getElementById('imageInput');
        const printArea = document.getElementById('printArea');

        imageInput.addEventListener('change', function(event) {
            const files = event.target.files;
            if (files.length === 0) return;

            const readers = Array.from(files).map(file => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            });

            Promise.all(readers).then(images => {
                // นำรูปใหม่ที่เลือกมารวมกับรูปเดิมที่มีอยู่
                allImages = allImages.concat(images);
                imageInput.value = ''; // รีเซ็ต input เพื่อให้เลือกไฟล์เดิมซ้ำได้ถ้าต้องการ
                renderPages();
            });
        });

        // ฟังก์ชันสำหรับลบรูปตามตำแหน่ง index
        function removeImage(index) {
            allImages.splice(index, 1); // ตัดรูปออกจากอาร์เรย์
            renderPages();
        }

        // ฟังก์ชันสร้างและเรนเดอร์หน้ากระดาษใหม่ทั้งหมด
        function renderPages() {
            printArea.innerHTML = '';

            if (allImages.length === 0) {
                printArea.innerHTML = '<div class="text-center text-gray-500 py-10 no-print" id="empty-message">ยังไม่ได้เลือกรูปภาพ กรุณาเลือกรูปภาพด้านบน</div>';
                return;
            }

            // วนลูปสร้างหน้า A4 แนวนอน (1 หน้าใส่ 3 รูป)
            for (let i = 0; i < allImages.length; i += 3) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page-container';

                const createBox = (imgSrc, globalIndex) => {
                    const box = document.createElement('div');
                    box.className = 'w-[90mm] h-[180mm] border-gray-200 rounded-lg flex items-center justify-center overflow-hidden bg-white relative';
                    
                    if (imgSrc) {
                        const imgElement = document.createElement('img');
                        imgElement.src = imgSrc;
                        imgElement.className = 'max-w-full max-h-full object-contain';
                        box.appendChild(imgElement);

                        // สร้างปุ่มลบรูป (❌)
                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'delete-btn absolute top-2 right-2 bg-red-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold shadow-md hover:bg-red-700 transition';
                        deleteBtn.innerHTML = '✕';
                        deleteBtn.title = 'ลบรูปนี้';
                        deleteBtn.onclick = () => removeImage(globalIndex);
                        
                        box.appendChild(deleteBtn);
                    } else {
                        // ซ่อนกล่องส่วนเกินในหน้าสุดท้าย
                        box.style.visibility = 'hidden';
                    }
                    return box;
                };

                // ใส่รูปที่ 1, 2, 3 พร้อมส่ง index จริงในอาเรย์เข้าไปด้วย
                pageDiv.appendChild(createBox(allImages[i], i));
                pageDiv.appendChild(createBox(allImages[i + 1], i + 1));
                pageDiv.appendChild(createBox(allImages[i + 2], i + 2));

                printArea.appendChild(pageDiv);
            }
        }
    </script>

</body>
</html>
