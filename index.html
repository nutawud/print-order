
<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ระบบพิมพ์ใบปะหน้า A4 - 4 รูปต่อหน้า
    </title>


    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>


    <!-- jsPDF -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            overflow-x: hidden;
        }


        body {

            background: #f3f4f6;
        }


        /* =========================================
           CONTROL
        ========================================= */

        #controlPanel {

            width: 100%;
        }


        /* =========================================
           PREVIEW AREA
        ========================================= */

        #printArea {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 20px;

            overflow: hidden;
        }


        /* =========================================
           PAGE WRAPPER
        ========================================= */

        .page-wrapper {

            width: 100%;

            display: flex;

            justify-content: center;

            overflow: hidden;
        }


        /* =========================================
           A4

           210 × 297 mm
        ========================================= */

        .page-container {

            width: 210mm;

            height: 297mm;

            min-width: 210mm;

            min-height: 297mm;

            margin: 0;

            padding: 0;

            background: white;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            grid-template-rows:
                1fr 1fr;

            gap: 0;

            overflow: hidden;

            box-shadow:
                0 0 12px
                rgba(0, 0, 0, 0.15);

            transform-origin:
                top center;

            flex-shrink: 0;
        }


        /* =========================================
           IMAGE BOX
        ========================================= */

        .image-box {

            width: 100%;

            height: 100%;

            min-width: 0;

            min-height: 0;

            margin: 0;

            padding: 0;

            border: none;

            background: white;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            position: relative;
        }


        /* =========================================
           IMAGE
        ========================================= */

        .image-box img {

            display: block;

            width: 100%;

            height: 100%;

            max-width: 100%;

            max-height: 100%;

            object-fit: contain;
        }


        /* =========================================
           DELETE BUTTON
        ========================================= */

        .delete-btn {

            position: absolute;

            top: 10px;

            right: 10px;

            width: 36px;

            height: 36px;

            border: none;

            border-radius: 50%;

            background: #dc2626;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 10;

            box-shadow:
                0 2px 6px
                rgba(0, 0, 0, 0.25);

            transition: 0.2s;
        }


        .delete-btn:hover {

            background: #b91c1c;

            transform: scale(1.05);
        }


        /* =========================================
           EMPTY BOX
        ========================================= */

        .empty-box {

            visibility: hidden;
        }


        /* =========================================
           PDF PREVIEW
        ========================================= */

        #pdfPreviewPage {

            display: none;

            position: fixed;

            inset: 0;

            z-index: 9999;

            background: #f3f4f6;

            flex-direction: column;
        }


        /* =========================================
           PDF HEADER
        ========================================= */

        .pdf-header {

            flex-shrink: 0;

            background: white;

            border-bottom: 1px solid #e5e7eb;

            padding: 12px 16px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            box-shadow:
                0 1px 4px
                rgba(0, 0, 0, 0.08);
        }


        .pdf-title {

            font-size: 18px;

            font-weight: 700;

            color: #1f2937;

            white-space: nowrap;
        }


        .pdf-buttons {

            display: flex;

            gap: 8px;
        }


        .pdf-btn {

            border: none;

            border-radius: 8px;

            padding: 9px 14px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            white-space: nowrap;
        }


        .pdf-print {

            background: #2563eb;

            color: white;
        }


        .pdf-download {

            background: #16a34a;

            color: white;
        }


        .pdf-back {

            background: #6b7280;

            color: white;
        }


        .pdf-btn:active {

            transform: scale(0.97);
        }


        /* =========================================
           PDF IFRAME
        ========================================= */

        #pdfFrame {

            width: 100%;

            flex: 1;

            border: none;

            background: #525252;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media screen and (max-width: 900px) {

            .page-container {

                transform:
                    scale(
                        calc(
                            (100vw - 20px)
                            / 793.7px
                        )
                    );
            }

        }


        @media screen and (max-width: 600px) {

            body {

                padding-top: 10px !important;

                padding-bottom: 10px !important;
            }


            #printArea {

                gap: 10px;
            }


            .page-container {

                transform:
                    scale(
                        calc(
                            (100vw - 10px)
                            / 793.7px
                        )
                    );
            }


            .delete-btn {

                width: 28px;

                height: 28px;

                top: 5px;

                right: 5px;

                font-size: 14px;
            }


            .pdf-header {

                padding: 8px;

                flex-direction: column;

                align-items: stretch;
            }


            .pdf-title {

                text-align: center;

                font-size: 16px;
            }


            .pdf-buttons {

                width: 100%;

                display: grid;

                grid-template-columns:
                    1fr 1fr 1fr;

                gap: 5px;
            }


            .pdf-btn {

                padding: 9px 5px;

                font-size: 12px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         CONTROL PANEL
    ====================================================== -->

    <div
        id="controlPanel"

        class="
            max-w-xl
            mx-auto
            mb-8
            bg-white
            p-6
            rounded-lg
            shadow-md
        "
    >


        <h2
            class="
                text-xl
                font-bold
                mb-2
                text-gray-800
            "
        >

            ระบบพิมพ์ใบปะหน้า

        </h2>


        <p
            class="
                text-sm
                text-gray-500
                mb-5
            "
        >

            A4 แนวตั้ง • 4 รูปต่อหน้า • 2 × 2 • ชิดขอบ

        </p>


        <!-- =====================================
             FILE INPUT
        ====================================== -->

        <div class="mb-4">


            <label
                class="
                    block
                    text-sm
                    font-medium
                    text-gray-700
                    mb-2
                "
            >

                เลือกรูปใบปะหน้า

            </label>


            <input
                type="file"

                id="imageInput"

                accept="image/*"

                multiple

                class="
                    w-full
                    text-sm
                    text-gray-500

                    file:mr-4
                    file:py-2
                    file:px-4

                    file:rounded-md
                    file:border-0

                    file:text-sm
                    file:font-semibold

                    file:bg-blue-50
                    file:text-blue-700

                    hover:file:bg-blue-100
                "
            >

        </div>


        <!-- =====================================
             BUTTONS
        ====================================== -->

        <div class="flex gap-2">


            <button
                type="button"

                onclick="createPDF()"

                id="createPdfBtn"

                class="
                    flex-1
                    bg-blue-600
                    text-white
                    py-2
                    px-4
                    rounded-md
                    font-medium
                    hover:bg-blue-700
                    transition
                "
            >

                📄 สร้าง PDF

            </button>


            <button
                type="button"

                onclick="clearAll()"

                class="
                    bg-red-600
                    text-white
                    py-2
                    px-4
                    rounded-md
                    font-medium
                    hover:bg-red-700
                    transition
                "
            >

                🗑️ ลบทั้งหมด

            </button>


        </div>


        <!-- =====================================
             COUNT
        ====================================== -->

        <div
            id="imageCount"

            class="
                mt-3
                text-sm
                text-gray-500
                text-center
            "
        >

            รูปทั้งหมด 0 รูป

        </div>


    </div>



    <!-- =====================================================
         IMAGE PREVIEW
    ====================================================== -->

    <div id="printArea">


        <div
            id="empty-message"

            class="
                text-center
                text-gray-500
                py-10
            "
        >

            ยังไม่ได้เลือกรูปภาพ

            <br>

            กรุณาเลือกรูปภาพด้านบน

        </div>


    </div>



    <!-- =====================================================
         PDF PREVIEW PAGE
    ====================================================== -->

    <div id="pdfPreviewPage">


        <!-- HEADER -->

        <div class="pdf-header">


            <div class="pdf-title">

                📄 ตัวอย่าง PDF

            </div>


            <div class="pdf-buttons">


                <!-- PRINT -->

                <button
                    type="button"

                    class="
                        pdf-btn
                        pdf-print
                    "

                    onclick="printPDF()"
                >

                    🖨️ พิมพ์

                </button>


                <!-- DOWNLOAD -->

                <button
                    type="button"

                    class="
                        pdf-btn
                        pdf-download
                    "

                    onclick="downloadPDF()"
                >

                    📥 ดาวน์โหลด

                </button>


                <!-- BACK -->

                <button
                    type="button"

                    class="
                        pdf-btn
                        pdf-back
                    "

                    onclick="closePDFPreview()"
                >

                    ↩️ กลับ

                </button>


            </div>

        </div>


        <!-- PDF -->

        <iframe
            id="pdfFrame"
            title="PDF Preview"
        ></iframe>


    </div>



    <script>


        /* ========================================
           VARIABLES
        ======================================== */

        let allImages = [];


        let currentPDFBlob = null;


        let currentPDFUrl = null;


        let currentFileName =
            "ใบปะหน้า.pdf";


        const imageInput =
            document.getElementById(
                "imageInput"
            );


        const printArea =
            document.getElementById(
                "printArea"
            );


        const imageCount =
            document.getElementById(
                "imageCount"
            );


        const pdfPreviewPage =
            document.getElementById(
                "pdfPreviewPage"
            );


        const pdfFrame =
            document.getElementById(
                "pdfFrame"
            );



        /* ========================================
           SELECT IMAGES
        ======================================== */

        imageInput.addEventListener(
            "change",
            function (event) {


                const files =
                    event.target.files;


                if (
                    !files ||
                    files.length === 0
                ) {

                    return;

                }


                const readers =
                    Array.from(files).map(
                        file => {


                            return new Promise(
                                (
                                    resolve,
                                    reject
                                ) => {


                                    const reader =
                                        new FileReader();


                                    reader.onload =
                                        function (e) {

                                            resolve(
                                                e.target.result
                                            );

                                        };


                                    reader.onerror =
                                        function () {

                                            reject(
                                                new Error(
                                                    "ไม่สามารถอ่านไฟล์ได้"
                                                )
                                            );

                                        };


                                    reader.readAsDataURL(
                                        file
                                    );

                                }
                            );

                        }
                    );



                Promise.all(readers)

                    .then(images => {


                        allImages =
                            allImages.concat(
                                images
                            );


                        imageInput.value =
                            "";


                        renderPages();


                    })

                    .catch(error => {


                        console.error(
                            error
                        );


                        alert(
                            "เกิดข้อผิดพลาดในการอ่านรูปภาพ"
                        );

                    });

            }
        );



        /* ========================================
           REMOVE IMAGE
        ======================================== */

        function removeImage(index) {


            allImages.splice(
                index,
                1
            );


            renderPages();

        }



        /* ========================================
           CLEAR ALL
        ======================================== */

        function clearAll() {


            if (
                allImages.length === 0
            ) {

                return;

            }


            if (
                !confirm(
                    "ต้องการลบรูปภาพทั้งหมดหรือไม่?"
                )
            ) {

                return;

            }


            allImages = [];


            renderPages();

        }



        /* ========================================
           RENDER PAGES
        ======================================== */

        function renderPages() {


            printArea.innerHTML =
                "";


            imageCount.innerText =
                `รูปทั้งหมด ${allImages.length} รูป`;


            if (
                allImages.length === 0
            ) {


                printArea.innerHTML = `

                    <div
                        class="
                            text-center
                            text-gray-500
                            py-10
                        "
                    >

                        ยังไม่ได้เลือกรูปภาพ

                        <br>

                        กรุณาเลือกรูปภาพด้านบน

                    </div>

                `;


                return;

            }



            /* ====================================
               4 รูปต่อหน้า
            ==================================== */

            for (
                let i = 0;
                i < allImages.length;
                i += 4
            ) {


                const wrapper =
                    document.createElement(
                        "div"
                    );


                wrapper.className =
                    "page-wrapper";


                const pageDiv =
                    document.createElement(
                        "div"
                    );


                pageDiv.className =
                    "page-container";



                /* =================================
                   CREATE BOX
                ================================= */

                function createBox(
                    imgSrc,
                    globalIndex
                ) {


                    const box =
                        document.createElement(
                            "div"
                        );


                    box.className =
                        "image-box";


                    if (imgSrc) {


                        const img =
                            document.createElement(
                                "img"
                            );


                        img.src =
                            imgSrc;


                        img.alt =
                            `ใบปะหน้า ${
                                globalIndex + 1
                            }`;


                        box.appendChild(
                            img
                        );



                        const deleteBtn =
                            document.createElement(
                                "button"
                            );


                        deleteBtn.type =
                            "button";


                        deleteBtn.className =
                            "delete-btn";


                        deleteBtn.innerHTML =
                            "✕";


                        deleteBtn.title =
                            "ลบรูปนี้";


                        deleteBtn.onclick =
                            function () {

                                removeImage(
                                    globalIndex
                                );

                            };


                        box.appendChild(
                            deleteBtn
                        );

                    }

                    else {

                        box.classList.add(
                            "empty-box"
                        );

                    }


                    return box;

                }



                /* =================================
                   4 รูป
                ================================= */

                pageDiv.appendChild(
                    createBox(
                        allImages[i],
                        i
                    )
                );


                pageDiv.appendChild(
                    createBox(
                        allImages[i + 1],
                        i + 1
                    )
                );


                pageDiv.appendChild(
                    createBox(
                        allImages[i + 2],
                        i + 2
                    )
                );


                pageDiv.appendChild(
                    createBox(
                        allImages[i + 3],
                        i + 3
                    )
                );


                wrapper.appendChild(
                    pageDiv
                );


                printArea.appendChild(
                    wrapper
                );

            }

        }



        /* ========================================
           CREATE PDF
        ======================================== */

        async function createPDF() {


            if (
                allImages.length === 0
            ) {

                alert(
                    "กรุณาเลือกรูปภาพก่อน"
                );

                return;

            }


            if (
                !window.jspdf ||
                !window.jspdf.jsPDF
            ) {

                alert(
                    "ไม่สามารถโหลดระบบ PDF ได้"
                );

                return;

            }


            const button =
                document.getElementById(
                    "createPdfBtn"
                );


            const originalText =
                button.innerHTML;


            button.disabled =
                true;


            button.innerHTML =
                "⏳ กำลังสร้าง PDF...";


            try {


                const {
                    jsPDF
                } = window.jspdf;


                /* =================================
                   A4
                ================================= */

                const pdf =
                    new jsPDF({

                        orientation:
                            "portrait",

                        unit:
                            "mm",

                        format:
                            "a4",

                        compress:
                            true

                    });


                const boxWidth =
                    105;


                const boxHeight =
                    148.5;



                /* =================================
                   ตำแหน่ง 4 ช่อง
                ================================= */

                const positions = [

                    {
                        x: 0,
                        y: 0
                    },

                    {
                        x: 105,
                        y: 0
                    },

                    {
                        x: 0,
                        y: 148.5
                    },

                    {
                        x: 105,
                        y: 148.5
                    }

                ];



                /* =================================
                   เพิ่มรูป
                ================================= */

                for (
                    let i = 0;
                    i < allImages.length;
                    i += 4
                ) {


                    if (
                        i > 0
                    ) {

                        pdf.addPage(
                            "a4",
                            "portrait"
                        );

                    }


                    for (
                        let j = 0;
                        j < 4;
                        j++
                    ) {


                        const index =
                            i + j;


                        if (
                            index >=
                            allImages.length
                        ) {

                            continue;

                        }


                        const imgSrc =
                            allImages[index];


                        const img =
                            await loadImage(
                                imgSrc
                            );


                        const imgWidth =
                            img.naturalWidth;


                        const imgHeight =
                            img.naturalHeight;


                        /*
                         Fit inside box
                        */

                        const ratio =
                            Math.min(

                                boxWidth /
                                imgWidth,

                                boxHeight /
                                imgHeight

                            );


                        const drawWidth =
                            imgWidth *
                            ratio;


                        const drawHeight =
                            imgHeight *
                            ratio;


                        const pos =
                            positions[j];


                        const x =
                            pos.x +
                            (
                                boxWidth -
                                drawWidth
                            ) / 2;


                        const y =
                            pos.y +
                            (
                                boxHeight -
                                drawHeight
                            ) / 2;


                        pdf.addImage(

                            imgSrc,

                            getImageType(
                                imgSrc
                            ),

                            x,

                            y,

                            drawWidth,

                            drawHeight,

                            undefined,

                            "FAST"

                        );

                    }

                }



                /* =================================
                   ชื่อไฟล์
                ================================= */

                currentFileName =
                    "ใบปะหน้า_" +
                    getDateString() +
                    ".pdf";



                /* =================================
                   PDF Blob
                ================================= */

                currentPDFBlob =
                    pdf.output(
                        "blob"
                    );


                /* =================================
                   URL
                ================================= */

                if (
                    currentPDFUrl
                ) {

                    URL.revokeObjectURL(
                        currentPDFUrl
                    );

                }


                currentPDFUrl =
                    URL.createObjectURL(
                        currentPDFBlob
                    );


                /* =================================
                   เปิดหน้า PDF Preview
                ================================= */

                pdfFrame.src =
                    currentPDFUrl;


                pdfPreviewPage.style.display =
                    "flex";


                /*
                 ล็อก scroll หน้าเดิม
                */

                document.body.style.overflow =
                    "hidden";


            }

            catch (error) {


                console.error(
                    error
                );


                alert(
                    "ไม่สามารถสร้าง PDF ได้"
                );

            }

            finally {


                button.disabled =
                    false;


                button.innerHTML =
                    originalText;

            }

        }



        /* ========================================
           PRINT PDF
        ======================================== */

        function printPDF() {


            if (
                !currentPDFUrl
            ) {

                alert(
                    "ยังไม่มี PDF"
                );

                return;

            }


            /*
             เปิด PDF แยกหน้า
             เพื่อให้ Safari / Chrome
             สามารถสั่งพิมพ์ได้
            */

            const printWindow =
                window.open(
                    currentPDFUrl,
                    "_blank"
                );


            /*
             บาง Browser block popup
            */

            if (!printWindow) {


                /*
                 เปิด PDF ใน tab เดิม
                */

                window.location.href =
                    currentPDFUrl;

                return;

            }


        }



        /* ========================================
           DOWNLOAD PDF
        ======================================== */

        function downloadPDF() {


            if (
                !currentPDFBlob
            ) {

                alert(
                    "ยังไม่มี PDF"
                );

                return;

            }


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                currentPDFUrl;


            link.download =
                currentFileName;


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );

        }



        /* ========================================
           CLOSE PDF PREVIEW
        ======================================== */

        function closePDFPreview() {


            pdfPreviewPage.style.display =
                "none";


            document.body.style.overflow =
                "";


            /*
             ไม่ revoke URL ตรงนี้
             เพราะอาจกลับมาเปิดดูใหม่
            */

        }



        /* ========================================
           LOAD IMAGE
        ======================================== */

        function loadImage(src) {


            return new Promise(
                (
                    resolve,
                    reject
                ) => {


                    const img =
                        new Image();


                    img.onload =
                        function () {

                            resolve(img);

                        };


                    img.onerror =
                        function () {

                            reject(
                                new Error(
                                    "โหลดรูปไม่สำเร็จ"
                                )
                            );

                        };


                    img.src =
                        src;

                }
            );

        }



        /* ========================================
           IMAGE TYPE
        ======================================== */

        function getImageType(src) {


            if (
                src.startsWith(
                    "data:image/png"
                )
            ) {

                return "PNG";

            }


            if (
                src.startsWith(
                    "data:image/webp"
                )
            ) {

                return "WEBP";

            }


            return "JPEG";

        }



        /* ========================================
           DATE FOR FILE NAME ONLY
        ======================================== */

        function getDateString() {


            const now =
                new Date();


            const year =
                now.getFullYear();


            const month =
                String(
                    now.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );


            const day =
                String(
                    now.getDate()
                ).padStart(
                    2,
                    "0"
                );


            return (
                year +
                month +
                day
            );

        }

    </script>


</body>

</html>
