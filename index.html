
<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ระบบพิมพ์ใบปะหน้า A4 - 4 รูปต่อหน้า
    </title>


    <!-- Tailwind -->

    <script src="https://cdn.tailwindcss.com"></script>


    <!-- jsPDF -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;

            overflow-x: hidden;
        }


        body {

            background: #f3f4f6;
        }


        /* =========================================
           PRINT AREA
        ========================================= */

        #printArea {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 20px;

            overflow: hidden;
        }


        /* =========================================
           PAGE WRAPPER
        ========================================= */

        .page-wrapper {

            width: 100%;

            display: flex;

            justify-content: center;

            overflow: hidden;
        }


        /* =========================================
           A4

           210 × 297 mm
        ========================================= */

        .page-container {

            width: 210mm;

            height: 297mm;

            min-width: 210mm;

            min-height: 297mm;

            margin: 0;

            padding: 0;

            background: white;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            grid-template-rows:
                1fr 1fr;

            gap: 0;

            overflow: hidden;

            box-shadow:
                0 0 12px
                rgba(0, 0, 0, 0.15);

            transform-origin:
                top center;

            flex-shrink: 0;
        }


        /* =========================================
           IMAGE BOX
        ========================================= */

        .image-box {

            width: 100%;

            height: 100%;

            min-width: 0;

            min-height: 0;

            margin: 0;

            padding: 0;

            border: none;

            background: white;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            position: relative;
        }


        /* =========================================
           IMAGE
        ========================================= */

        .image-box img {

            display: block;

            width: 100%;

            height: 100%;

            max-width: 100%;

            max-height: 100%;

            object-fit: contain;
        }


        /* =========================================
           DELETE BUTTON
        ========================================= */

        .delete-btn {

            position: absolute;

            top: 10px;

            right: 10px;

            width: 36px;

            height: 36px;

            border: none;

            border-radius: 50%;

            background: #dc2626;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            z-index: 10;

            box-shadow:
                0 2px 6px
                rgba(0, 0, 0, 0.25);

            transition: 0.2s;
        }


        .delete-btn:hover {

            background: #b91c1c;

            transform: scale(1.05);
        }


        /* =========================================
           EMPTY BOX
        ========================================= */

        .empty-box {

            visibility: hidden;
        }


        /* =========================================
           DESKTOP PREVIEW
        ========================================= */

        @media screen and (max-width: 900px) {

            .page-container {

                transform:
                    scale(
                        calc(
                            (100vw - 20px)
                            / 793.7px
                        )
                    );
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media screen and (max-width: 600px) {

            body {

                padding-top: 10px !important;

                padding-bottom: 10px !important;
            }


            #printArea {

                gap: 10px;
            }


            .page-container {

                transform:
                    scale(
                        calc(
                            (100vw - 10px)
                            / 793.7px
                        )
                    );
            }


            .delete-btn {

                width: 28px;

                height: 28px;

                top: 5px;

                right: 5px;

                font-size: 14px;
            }

        }


    </style>

</head>


<body>


    <!-- =========================================
         CONTROL
    ========================================== -->

    <div
        class="
            max-w-xl
            mx-auto
            mb-8
            bg-white
            p-6
            rounded-lg
            shadow-md
        "
    >


        <h2
            class="
                text-xl
                font-bold
                mb-2
                text-gray-800
            "
        >

            ระบบพิมพ์ใบปะหน้า

        </h2>


        <p
            class="
                text-sm
                text-gray-500
                mb-5
            "
        >

            A4 แนวตั้ง • 4 รูปต่อหน้า • 2 × 2 • ชิดขอบ

        </p>


        <!-- =====================================
             FILE INPUT
        ====================================== -->

        <div class="mb-4">


            <label
                class="
                    block
                    text-sm
                    font-medium
                    text-gray-700
                    mb-2
                "
            >

                เลือกรูปใบปะหน้า

            </label>


            <input
                type="file"
                id="imageInput"
                accept="image/*"
                multiple

                class="
                    w-full
                    text-sm
                    text-gray-500

                    file:mr-4
                    file:py-2
                    file:px-4

                    file:rounded-md
                    file:border-0

                    file:text-sm
                    file:font-semibold

                    file:bg-blue-50
                    file:text-blue-700

                    hover:file:bg-blue-100
                "
            >

        </div>


        <!-- =====================================
             BUTTONS
        ====================================== -->

        <div class="flex gap-2">


            <!-- PDF -->

            <button
                type="button"
                onclick="createPDF()"

                class="
                    flex-1
                    bg-blue-600
                    text-white
                    py-2
                    px-4
                    rounded-md
                    font-medium
                    hover:bg-blue-700
                    transition
                "
            >

                📄 สร้าง PDF / พิมพ์

            </button>


            <!-- CLEAR -->

            <button
                type="button"
                onclick="clearAll()"

                class="
                    bg-red-600
                    text-white
                    py-2
                    px-4
                    rounded-md
                    font-medium
                    hover:bg-red-700
                    transition
                "
            >

                🗑️ ลบทั้งหมด

            </button>


        </div>


        <!-- =====================================
             COUNT
        ====================================== -->

        <div
            id="imageCount"

            class="
                mt-3
                text-sm
                text-gray-500
                text-center
            "
        >

            รูปทั้งหมด 0 รูป

        </div>


    </div>



    <!-- =========================================
         PREVIEW
    ========================================== -->

    <div id="printArea">


        <div
            id="empty-message"

            class="
                text-center
                text-gray-500
                py-10
            "
        >

            ยังไม่ได้เลือกรูปภาพ

            <br>

            กรุณาเลือกรูปภาพด้านบน

        </div>


    </div>



    <script>


        /* ========================================
           VARIABLES
        ======================================== */

        let allImages = [];


        const imageInput =
            document.getElementById(
                "imageInput"
            );


        const printArea =
            document.getElementById(
                "printArea"
            );


        const imageCount =
            document.getElementById(
                "imageCount"
            );



        /* ========================================
           FILE SELECT
        ======================================== */

        imageInput.addEventListener(
            "change",
            function (event) {


                const files =
                    event.target.files;


                if (
                    !files ||
                    files.length === 0
                ) {

                    return;

                }


                const readers =
                    Array.from(files).map(
                        file => {


                            return new Promise(
                                (
                                    resolve,
                                    reject
                                ) => {


                                    const reader =
                                        new FileReader();


                                    reader.onload =
                                        function (e) {

                                            resolve(
                                                e.target.result
                                            );

                                        };


                                    reader.onerror =
                                        function () {

                                            reject(
                                                new Error(
                                                    "ไม่สามารถอ่านไฟล์ได้"
                                                )
                                            );

                                        };


                                    reader.readAsDataURL(
                                        file
                                    );

                                }
                            );

                        }
                    );



                Promise.all(readers)

                    .then(images => {


                        /*
                         เพิ่มรูป
                        */

                        allImages =
                            allImages.concat(
                                images
                            );


                        /*
                         reset input
                        */

                        imageInput.value =
                            "";


                        /*
                         render
                        */

                        renderPages();


                    })

                    .catch(error => {


                        console.error(
                            error
                        );


                        alert(
                            "เกิดข้อผิดพลาดในการอ่านรูปภาพ"
                        );

                    });

            }
        );



        /* ========================================
           REMOVE IMAGE
        ======================================== */

        function removeImage(index) {


            allImages.splice(
                index,
                1
            );


            renderPages();

        }



        /* ========================================
           CLEAR ALL
        ======================================== */

        function clearAll() {


            if (
                allImages.length === 0
            ) {

                return;

            }


            const confirmDelete =
                confirm(
                    "ต้องการลบรูปภาพทั้งหมดหรือไม่?"
                );


            if (!confirmDelete) {

                return;

            }


            allImages = [];


            renderPages();

        }



        /* ========================================
           RENDER
        ======================================== */

        function renderPages() {


            printArea.innerHTML =
                "";


            imageCount.innerText =
                `รูปทั้งหมด ${allImages.length} รูป`;


            /* ไม่มีรูป */

            if (
                allImages.length === 0
            ) {


                printArea.innerHTML = `

                    <div
                        class="
                            text-center
                            text-gray-500
                            py-10
                        "
                    >

                        ยังไม่ได้เลือกรูปภาพ

                        <br>

                        กรุณาเลือกรูปภาพด้านบน

                    </div>

                `;


                return;

            }



            /* ====================================
               แบ่งทีละ 4
            ==================================== */

            for (
                let i = 0;
                i < allImages.length;
                i += 4
            ) {


                /*
                 Wrapper
                */

                const wrapper =
                    document.createElement(
                        "div"
                    );


                wrapper.className =
                    "page-wrapper";



                /*
                 A4
                */

                const pageDiv =
                    document.createElement(
                        "div"
                    );


                pageDiv.className =
                    "page-container";



                /* =================================
                   CREATE BOX
                ================================= */

                function createBox(
                    imgSrc,
                    globalIndex
                ) {


                    const box =
                        document.createElement(
                            "div"
                        );


                    box.className =
                        "image-box";


                    if (imgSrc) {


                        /*
                         IMAGE
                        */

                        const img =
                            document.createElement(
                                "img"
                            );


                        img.src =
                            imgSrc;


                        img.alt =
                            `ใบปะหน้า ${
                                globalIndex + 1
                            }`;


                        box.appendChild(
                            img
                        );



                        /*
                         DELETE
                        */

                        const deleteBtn =
                            document.createElement(
                                "button"
                            );


                        deleteBtn.type =
                            "button";


                        deleteBtn.className =
                            "delete-btn";


                        deleteBtn.innerHTML =
                            "✕";


                        deleteBtn.title =
                            "ลบรูปนี้";


                        deleteBtn.onclick =
                            function () {

                                removeImage(
                                    globalIndex
                                );

                            };


                        box.appendChild(
                            deleteBtn
                        );

                    }

                    else {


                        box.classList.add(
                            "empty-box"
                        );

                    }


                    return box;

                }



                /* =================================
                   4 BOXES
                ================================= */

                pageDiv.appendChild(
                    createBox(
                        allImages[i],
                        i
                    )
                );


                pageDiv.appendChild(
                    createBox(
                        allImages[i + 1],
                        i + 1
                    )
                );


                pageDiv.appendChild(
                    createBox(
                        allImages[i + 2],
                        i + 2
                    )
                );


                pageDiv.appendChild(
                    createBox(
                        allImages[i + 3],
                        i + 3
                    )
                );



                /*
                 wrapper
                */

                wrapper.appendChild(
                    pageDiv
                );


                /*
                 print area
                */

                printArea.appendChild(
                    wrapper
                );

            }

        }



        /* ========================================
           CREATE PDF
        ======================================== */

        async function createPDF() {


            /*
             ตรวจสอบรูป
            */

            if (
                allImages.length === 0
            ) {

                alert(
                    "กรุณาเลือกรูปภาพก่อน"
                );

                return;

            }


            /*
             ตรวจสอบ jsPDF
            */

            if (
                !window.jspdf ||
                !window.jspdf.jsPDF
            ) {

                alert(
                    "ไม่สามารถโหลดระบบสร้าง PDF ได้"
                );

                return;

            }


            /*
             ปุ่ม
            */

            const button =
                document.querySelector(
                    'button[onclick="createPDF()"]'
                );


            const originalText =
                button.innerHTML;


            button.disabled =
                true;


            button.innerHTML =
                "⏳ กำลังสร้าง PDF...";


            try {


                const {
                    jsPDF
                } = window.jspdf;


                /*
                 A4 portrait

                 หน่วยเป็น mm
                */

                const pdf =
                    new jsPDF({

                        orientation: "portrait",

                        unit: "mm",

                        format: "a4",

                        compress: true

                    });



                /*
                 A4

                 210 × 297 mm
                */

                const pageWidth =
                    210;


                const pageHeight =
                    297;


                /*
                 แต่ละช่อง

                 105 × 148.5 mm
                */

                const boxWidth =
                    105;


                const boxHeight =
                    148.5;



                /*
                 วนทีละ 4 รูป
                */

                for (
                    let i = 0;
                    i < allImages.length;
                    i += 4
                ) {


                    /*
                     หน้าแรกไม่ต้อง addPage
                    */

                    if (i > 0) {

                        pdf.addPage(
                            "a4",
                            "portrait"
                        );

                    }


                    /*
                     4 ตำแหน่ง
                    */

                    const positions = [

                        {
                            x: 0,
                            y: 0
                        },

                        {
                            x: 105,
                            y: 0
                        },

                        {
                            x: 0,
                            y: 148.5
                        },

                        {
                            x: 105,
                            y: 148.5
                        }

                    ];



                    /*
                     เพิ่มรูป
                    */

                    for (
                        let j = 0;
                        j < 4;
                        j++
                    ) {


                        const index =
                            i + j;


                        /*
                         ไม่มีรูป
                         ข้าม
                        */

                        if (
                            index >=
                            allImages.length
                        ) {

                            continue;

                        }


                        const imgSrc =
                            allImages[index];


                        /*
                         โหลดรูป
                        */

                        const img =
                            await loadImage(
                                imgSrc
                            );


                        /*
                         ตำแหน่ง
                        */

                        const pos =
                            positions[j];


                        /*
                         คำนวณขนาด
                         ให้รูปอยู่ในช่อง
                         โดยไม่ตัดรูป
                        */

                        const imgWidth =
                            img.naturalWidth;


                        const imgHeight =
                            img.naturalHeight;


                        const ratio =
                            Math.min(

                                boxWidth /
                                imgWidth,

                                boxHeight /
                                imgHeight

                            );


                        let drawWidth =
                            imgWidth *
                            ratio;


                        let drawHeight =
                            imgHeight *
                            ratio;


                        /*
                         จัดกึ่งกลาง
                        */

                        const x =
                            pos.x +
                            (
                                boxWidth -
                                drawWidth
                            ) / 2;


                        const y =
                            pos.y +
                            (
                                boxHeight -
                                drawHeight
                            ) / 2;



                        /*
                         เพิ่มรูปลง PDF
                        */

                        pdf.addImage(

                            imgSrc,

                            getImageType(
                                imgSrc
                            ),

                            x,

                            y,

                            drawWidth,

                            drawHeight,

                            undefined,

                            "FAST"

                        );

                    }

                }



                /*
                 สร้างชื่อไฟล์
                */

                const fileName =
                    "ใบปะหน้า_" +
                    getDateString() +
                    ".pdf";



                /*
                 Blob
                */

                const pdfBlob =
                    pdf.output(
                        "blob"
                    );


                /*
                 ตรวจสอบ iPhone
                */

                const isIOS =
                    /iPad|iPhone|iPod/.test(
                        navigator.userAgent
                    ) &&
                    !window.MSStream;



                if (isIOS) {


                    /*
                     เปิด PDF ใน Safari
                    */

                    const blobUrl =
                        URL.createObjectURL(
                            pdfBlob
                        );


                    window.location.href =
                        blobUrl;


                }

                else {


                    /*
                     Desktop

                     ดาวน์โหลด PDF
                    */

                    pdf.save(
                        fileName
                    );

                }


            }

            catch (error) {


                console.error(
                    error
                );


                alert(
                    "ไม่สามารถสร้าง PDF ได้"
                );


            }

            finally {


                button.disabled =
                    false;


                button.innerHTML =
                    originalText;

            }

        }



        /* ========================================
           LOAD IMAGE
        ======================================== */

        function loadImage(src) {


            return new Promise(
                (
                    resolve,
                    reject
                ) => {


                    const img =
                        new Image();


                    img.onload =
                        function () {

                            resolve(img);

                        };


                    img.onerror =
                        function () {

                            reject(
                                new Error(
                                    "โหลดรูปไม่สำเร็จ"
                                )
                            );

                        };


                    img.src =
                        src;

                }
            );

        }



        /* ========================================
           IMAGE TYPE
        ======================================== */

        function getImageType(src) {


            if (
                src.startsWith(
                    "data:image/png"
                )
            ) {

                return "PNG";

            }


            if (
                src.startsWith(
                    "data:image/webp"
                )
            ) {

                return "WEBP";

            }


            return "JPEG";

        }



        /* ========================================
           DATE
           ใช้แค่ตั้งชื่อไฟล์
           ไม่ได้ใส่ลง PDF
        ======================================== */

        function getDateString() {


            const now =
                new Date();


            const year =
                now.getFullYear();


            const month =
                String(
                    now.getMonth() + 1
                ).padStart(
                    2,
                    "0"
                );


            const day =
                String(
                    now.getDate()
                ).padStart(
                    2,
                    "0"
                );


            return (
                year +
                month +
                day
            );

        }


    </script>

</body>

</html>
